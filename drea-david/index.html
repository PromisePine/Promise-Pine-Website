<!DOCTYPE html>

</head>
<body>

      <div class="hero-slide" style="background-image: url('Images/Arm in arm 2.jpeg');"></div>
      <div class="hero-slide" style="background-image: url('Images/Bridal Party.jpeg');"></div>
      <div class="hero-slide" style="background-image: url('Images/Bride & Groom Prep.jpeg');"></div>
      <div class="hero-slide" style="background-image: url('Images/Bride and Castle.jpeg');"></div>
      <div class="hero-slide" style="background-image: url('Images/Bride ponder.jpeg');"></div>
      <div class="hero-slide" style="background-image: url('Images/Castle and Couple.jpeg');"></div>
      <div class="hero-slide" style="background-image: url('Images/Castle and Vows.jpeg');"></div>
      <div class="hero-slide" style="background-image: url('Images/Castle.jpeg');"></div>
      <div class="hero-slide" style="background-image: url('Images/Vows.jpeg');"></div>

  <main class="container" role="main">
    <section class="video-section" aria-labelledby="film-title">
      <h2 id="film-title" class="section-title">Wedding Film</h2>

      <div class="video-frame" id="videoFrame" aria-label="Vimeo video player">
        <noscript>
          <p>To watch this film, please enable JavaScript or open it directly on Vimeo:</p>
          <p><a class="button" href="https://vimeo.com/promisepine/drea-david" target="_blank" rel="noopener">Open on Vimeo</a></p>
        </noscript>
      </div>

      <div class="watch-actions">
        <a class="button" href="https://vimeo.com/promisepine/drea-david" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          Open in Vimeo
        </a>
        <button class="button" id="copyLinkBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          Copy Link
        </button>
        <button class="button" id="shareBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          Share
        </button>
      </div>
    </section>

    <section class="about">
      <p class="lead">Thank you for including me in your day. I hope this film brings you back to the warmth, vows, and celebration of your story.</p>
    </section>

    <section class="video-section raw-footage-section">
      <h2 class="section-title">Documentary Film</h2>
      
      <div class="video-frame" id="documentaryVideoFrame" aria-label="Vimeo documentary video player">
        <noscript>
          <p>To watch this documentary, please enable JavaScript or open it directly on Vimeo:</p>
          <p><a class="button" href="https://vimeo.com/1151744339" target="_blank" rel="noopener">Open on Vimeo</a></p>
        </noscript>
      </div>
    </section>

    <section class="download-section">
      <h2 class="section-title">Download Files</h2>
      <p class="lead">Access your wedding videos here</p>
      <div class="download-actions">
        <a class="download-button" href="https://1drv.ms/f/c/a7ba6ea02575ee91/EhrqR1aDuiRIkbFVTmKRPToBsNP0l5b_q4qNf_-mZfp0Ig?e=UKeN8g" target="_blank" rel="noopener">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download from OneDrive
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Promise Pine</p>
  </footer>

  <script>
    // Set current year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Hero slideshow animation
    (function initSlideshow() {
      const slides = document.querySelectorAll('.hero-slide');
      let currentSlide = 0;
      
      function nextSlide() {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
      }
      
      // Change slide every 4 seconds
      setInterval(nextSlide, 4000);
    })();

    // Custom thumbnail with play button - loads player on click
    (function initCustomPlayer() {
      const target = document.getElementById('videoFrame');
      const vimeoUrl = 'https://vimeo.com/promisepine/drea-david';
      const oembed = `https://vimeo.com/api/oembed.json?url=${encodeURIComponent(vimeoUrl)}&dnt=1&responsive=1&byline=0&portrait=0&title=0`;

      // Detect mobile device
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

      // Create custom thumbnail with play button using local image
      const thumbnailContainer = document.createElement('div');
      thumbnailContainer.className = 'video-thumbnail';
      thumbnailContainer.innerHTML = `
        <img src="Thumbnail.jpeg" alt="Drea & David Wedding Film Thumbnail" class="thumbnail-image" />
        <button class="play-button" aria-label="Play wedding film">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>Play</span>
        </button>
      `;
      
      target.appendChild(thumbnailContainer);
      
      // Load player on click
      thumbnailContainer.addEventListener('click', function() {
        // Fetch embed code when user clicks
        fetch(oembed)
          .then(r => r.ok ? r.json() : Promise.reject(new Error('Failed to load video')))
          .then(data => {
            target.innerHTML = data.html;
            const iframe = target.querySelector('iframe');
            if (iframe) {
              iframe.setAttribute('title', 'Drea & David — Wedding Film');
              iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
              iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
              
              // Add autoplay parameter to start playing immediately
              let src = iframe.getAttribute('src');
              if (src) {
                const separator = src.includes('?') ? '&' : '?';
                
                // On mobile: unmute and enable fullscreen
                if (isMobile) {
                  src += separator + 'autoplay=1&muted=0';
                  
                  // Request fullscreen on mobile
                  iframe.addEventListener('load', function() {
                    // Small delay to ensure video is ready
                    setTimeout(() => {
                      if (iframe.requestFullscreen) {
                        iframe.requestFullscreen().catch(err => {
                          console.log('Fullscreen request failed:', err);
                        });
                      } else if (iframe.webkitRequestFullscreen) {
                        iframe.webkitRequestFullscreen();
                      } else if (iframe.mozRequestFullScreen) {
                        iframe.mozRequestFullScreen();
                      } else if (iframe.msRequestFullscreen) {
                        iframe.msRequestFullscreen();
                      }
                    }, 100);
                  });
                } else {
                  // Desktop: just autoplay
                  src += separator + 'autoplay=1';
                }
                
                iframe.setAttribute('src', src);
              }
            }
          })
          .catch(() => {
            target.innerHTML = '<div class="video-fallback">Unable to load the video. <a href="https://vimeo.com/promisepine/drea-david" target="_blank" rel="noopener">Watch on Vimeo</a>.</div>';
          });
      });
    })();

    // Copy link functionality
    document.getElementById('copyLinkBtn').addEventListener('click', function() {
      const vimeoLink = 'https://vimeo.com/promisepine/drea-david';
      navigator.clipboard.writeText(vimeoLink).then(() => {
        const btn = this;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!';
        setTimeout(() => {
          btn.innerHTML = originalText;
        }, 2000);
      }).catch(() => {
        alert('Failed to copy link. Please copy manually: https://vimeo.com/promisepine/drea-david');
      });
    });

    // Share functionality
    document.getElementById('shareBtn').addEventListener('click', function() {
      const vimeoLink = 'https://vimeo.com/promisepine/drea-david';
      const shareData = {
        title: 'Drea & David - Wedding Film',
        text: 'Watch our wedding film by Promise Pine',
        url: vimeoLink
      };
      
      if (navigator.share) {
        navigator.share(shareData).catch(() => {
          // User cancelled or error - do nothing
        });
      } else {
        // Fallback: copy to clipboard
        navigator.clipboard.writeText(vimeoLink).then(() => {
          alert('Link copied to clipboard! Share it with your friends and family.');
        }).catch(() => {
          alert('Share link: https://vimeo.com/promisepine/drea-david');
        });
      }
    });

    // Documentary video custom thumbnail with play button
    (function initDocumentaryPlayer() {
      const target = document.getElementById('documentaryVideoFrame');
      
      // Create custom thumbnail with play button using documentary thumbnail image
      const thumbnailContainer = document.createElement('div');
      thumbnailContainer.className = 'video-thumbnail';
      thumbnailContainer.innerHTML = `
        <img src="Documentary Thumbnail.jpeg" alt="Drea & David Documentary Thumbnail" class="thumbnail-image" />
        <button class="play-button" aria-label="Play documentary film">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>Play</span>
        </button>
      `;
      
      target.appendChild(thumbnailContainer);
      
      // Load player on click - use exact embed code provided
      thumbnailContainer.addEventListener('click', function() {
        target.innerHTML = '<div style="padding:66.67% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/1151744339?h=9dbb57bdca&badge=0&autopause=0&player_id=0&app_id=58479&autoplay=1" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="Drea &amp; David Documentary"></iframe></div><script src="https://player.vimeo.com/api/player.js"><\/script>';
      });
    })();
  </script>
</body>
</html>
