<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/PP%20Favicon.png">
<title>ReAnna &amp; Chasen — A Promise Pine Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#161D11;--sun:#D9A166;--ivory:#F6EFDF;--mute:rgba(246,239,223,.64);--line:rgba(246,239,223,.16)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--ivory);font:400 16px/1.6 'Archivo',sans-serif;-webkit-font-smoothing:antialiased}
body:not(.go){overflow:hidden}
h1,h2,b{font-family:'Newsreader',serif;font-weight:500;margin:0}
button{font:inherit;color:inherit}a{color:inherit;text-decoration:none}[hidden]{display:none!important}
/* intro gate */
#gate{position:fixed;inset:0;z-index:300;background:#F3EBDB;color:#26331D;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;transition:opacity 1.2s ease,visibility 1.2s}
#gate.gone{opacity:0;visibility:hidden}
#gate .eb{letter-spacing:.35em;text-transform:uppercase;font-size:.7rem;color:#8A6D3B}
#gate h1{font:400 clamp(2.6rem,9vw,6rem)/1.05 'Newsreader',serif;margin:1.2rem 0 .6rem}
#gate h1 em{color:#8A6D3B}
#gate p{color:#7A7567;letter-spacing:.2em;font-size:.8rem;margin:0}
.begin{background:none;border:1px solid #8A6D3B;color:#26331D;padding:.9rem 2.4rem;letter-spacing:.3em;text-transform:uppercase;font:inherit;font-size:.75rem;cursor:pointer;transition:.4s;margin-top:2.5rem}
.begin:hover{background:#8A6D3B;color:#F3EBDB}
.rule{width:1px;height:64px;background:#8A6D3B;margin:2rem auto 0;opacity:.6}
.fade{opacity:0;transform:translateY(14px);animation:up 1.4s ease forwards}.d1{animation-delay:.3s}.d2{animation-delay:.9s}.d3{animation-delay:1.5s}.d4{animation-delay:2.1s}
@keyframes up{to{opacity:1;transform:none}}
/* hero gallery */
.hero{position:relative;display:flex;flex-direction:column;height:100vh;height:100svh;min-height:660px;overflow:hidden}
.hero .bg{position:absolute;inset:0;background:linear-gradient(200deg,#3D4F2E,#161D11) center/cover}
.bgv{position:absolute;inset:0;opacity:0;transition:opacity 1.5s}.bgv.on{opacity:1}
.bgv iframe{position:absolute;top:50%;left:50%;border:0;pointer-events:none;width:max(100vw,calc(100vh / var(--r)));height:calc(max(100vw,calc(100vh / var(--r))) * var(--r));transform:translate(-50%,-50%)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(22,29,17,.88) 0%,rgba(22,29,17,.12) 48%,rgba(22,29,17,.4) 100%)}
.top,.mid,.rw{position:relative;z-index:3;transition:opacity 1.2s ease,transform 1.2s ease}
body:not(.go) .top,body:not(.go) .mid,body:not(.go) .rw{opacity:0;transform:translateY(10px)}
.mid{transition-delay:.35s}.rw{transition-delay:.7s}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 32px}
.who{display:flex;align-items:center;gap:14px;font-size:15px}
.logo{width:48px;height:48px;border-radius:50%;background:rgba(22,29,17,.75);border:1px solid var(--line);display:grid;place-items:center}
.logo svg{width:28px;height:28px;fill:none;stroke:var(--ivory);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pills{display:flex;gap:10px}
.pill{height:44px;padding:0 20px;border-radius:999px;background:rgba(246,239,223,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(246,239,223,.2);display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .25s}
.pill:hover{background:rgba(246,239,223,.28)}
.pill.ic{width:44px;padding:0}
.pill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pill.big{height:50px;padding:0 28px;margin-top:30px}
.tri{width:0;height:0;border:6px solid transparent;border-left:10px solid currentColor;margin-left:2px}
.mid{flex:1;display:flex;align-items:flex-end;padding:0 40px 34px}
.mid h1{font-size:clamp(44px,6.8vw,96px);line-height:1;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.meta{margin-top:14px;font-size:16px;color:rgba(246,239,223,.88)}
.rw{position:relative}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 32px 32px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 clamp(230px,19vw,330px);aspect-ratio:16/10;border-radius:16px;overflow:hidden;border:0;padding:0;background:linear-gradient(160deg,#3D4F2E,#26331D);cursor:pointer;scroll-snap-align:start;transition:transform .3s}
.card:hover,.card:focus-visible{transform:translateY(-4px)}
.card .g{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.card:hover .g{transform:scale(1.06)}
.card::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(0deg,rgba(10,14,7,.75),transparent 55%)}
.pv{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .6s;z-index:1}.pv.on{opacity:1}
.pv iframe{position:absolute;top:50%;left:50%;width:100%;height:100%;border:0;transform:translate(-50%,-50%) scale(1.3);pointer-events:none}
.lab{position:absolute;left:16px;bottom:14px;z-index:3;text-align:left}
.lab strong{display:block;font-weight:500;font-size:16px}
.lab span{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-top:2px}
.lab .tri{border-width:4px 0 4px 7px;border-color:transparent transparent transparent currentColor;margin:0}
.card.soon{cursor:default;opacity:.55}
.chev{position:absolute;top:calc(50% - 16px);transform:translateY(-50%);background:none;border:0;font-size:56px;line-height:1;cursor:pointer;text-shadow:0 2px 14px rgba(0,0,0,.7);z-index:5;padding:0 10px}
.chev.r{right:12px}.chev.l{left:12px}
/* below the fold */
.wrap{max-width:1000px;margin:0 auto;padding:110px 40px 20px}
.note h2{font-size:clamp(28px,3.4vw,42px);margin-bottom:26px}
.note p{font:italic 400 clamp(20px,2.4vw,28px)/1.55 'Newsreader',serif;margin:0 0 20px;color:rgba(246,239,223,.92);border-left:2px solid var(--sun);padding-left:28px}
.note small{display:block;color:var(--mute);padding-left:30px}
.end{text-align:center;padding:110px 24px 90px}
.end h2{font-size:clamp(30px,4vw,50px)}
.end p{color:var(--mute);max-width:440px;margin:16px auto 30px}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pill.gold{background:var(--sun);color:var(--ink);border-color:var(--sun);font-weight:500}.pill.gold:hover{background:#E3B27B}
footer{border-top:1px solid var(--line);padding:30px 40px;color:var(--mute);font-size:13.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
/* player + sheet */
#md{position:fixed;inset:0;z-index:200;background:rgba(10,14,7,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;animation:fade .35s}
@keyframes fade{from{opacity:0}}
#mb{position:relative}#mb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#mx,.sheet .x{position:absolute;top:16px;right:24px;background:none;border:0;font-size:38px;cursor:pointer;line-height:1}
#nx{margin-top:22px}
.sheet{position:fixed;inset:0;z-index:200;background:rgba(10,14,7,.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px}
.box{position:relative;width:100%;max-width:560px;background:#1D2616;border:1px solid var(--line);border-radius:16px;padding:34px}
.box h2{font-size:30px;margin-bottom:18px}.box .x{top:10px;right:16px;font-size:32px}
.dl>div{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 0;border-top:1px solid var(--line)}
.dl b{font-size:20px;display:block}.dl span.d{color:var(--mute);font-size:14px}
@media(max-width:700px){.top{padding:16px}.pill{height:40px;padding:0 14px}.pill.ic{width:40px;padding:0}.pill .t{display:none}.pill.big .t{display:inline}.mid{padding:0 20px 22px}.row{padding:0 16px 20px}.card{flex-basis:72vw}.chev{display:none}.wrap{padding:80px 24px 10px}footer{padding:24px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fade{animation:none;opacity:1;transform:none}}
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 10px);min-width:270px;background:#1D2616;border:1px solid var(--line);border-radius:14px;padding:8px;z-index:20;box-shadow:0 20px 50px -10px rgba(0,0,0,.6)}
.menu a{display:flex;flex-direction:column;padding:12px 14px;border-radius:10px;transition:background .2s}
.menu a:hover{background:rgba(246,239,223,.1)}
.menu b{font-size:17px}.menu span{color:var(--mute);font-size:13px}
img.logo{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#EBDCC0;display:block}
.acts3{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px;padding-left:30px}.acts3 .pill{padding:0 22px}
.rl{display:flex;flex-direction:column;gap:10px}.rl a{height:50px}
@media(max-width:700px){.acts3{padding-left:0}}
</style>
</head>

const F=COUPLE.films,live=F.map((f,i)=>f.id?i:-1).filter(i=>i>=0);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,wide=innerWidth>760;
document.title=COUPLE.names+' — A Promise Pine Film';
$('#g-names').innerHTML=COUPLE.names.split(' & ').join(' <em>&amp;</em> ');
$('#g-sub').textContent=COUPLE.date||'';
$('#names').textContent=COUPLE.names;$('#meta').textContent=COUPLE.meta.join('  ·  ');$('#meta').hidden=!COUPLE.meta.length;
$('#note').textContent=COUPLE.note;if(!COUPLE.note)['h2','p','small'].forEach(t=>$(t,$('#note-sec')).hidden=true);
const go=()=>{$('#gate').classList.add('gone');document.body.classList.add('go');setTimeout(()=>$('#gate')&&$('#gate').remove(),1400)};
$('#enter').onclick=go;addEventListener('keydown',e=>{if(e.key==='Enter'&&!document.body.classList.contains('go'))go()});
const hp=f=>f.h?'h='+f.h+'&':'';
const thumb=(f,w,cb)=>fetch('https://vimeo.com/api/oembed.json?width='+w+'&url='+encodeURIComponent('https://vimeo.com/'+f.id+(f.h?'/'+f.h:''))).then(r=>r.json()).then(d=>cb(d.thumbnail_url)).catch(()=>{});
const bgm=f=>`https://player.vimeo.com/video/${f.id}?${hp(f)}background=1&autoplay=1&muted=1&loop=1&autopause=0&app_id=58479`;
// hero backdrop
if(live.length){const m=F[live[0]];$('#hero').style.setProperty('--r',m.r/100);
thumb(m,1920,u=>$('#hbg').style.backgroundImage=`url("${u}")`);
if(!reduce&&wide){$('#hbv').innerHTML=`<iframe src="${bgm(m)}" allow="autoplay" title=""></iframe>`;$('#hbv iframe').onload=()=>setTimeout(()=>$('#hbv').classList.add('on'),600)}}
else{$('#all').hidden=true}
// film cards
const row=$('#row');
row.innerHTML=F.map((f,i)=>`<button class="card${f.id?'':' soon'}" data-i="${i}"${f.id?'':' disabled'}><div class="g"></div><div class="lab"><strong>${f.title}</strong><span>${f.id?'<i class="tri"></i>Play film':'Coming soon'}</span></div></button>`).join('');
document.querySelectorAll('.card:not(.soon)').forEach(c=>{const f=F[c.dataset.i];
thumb(f,960,u=>$('.g',c).style.backgroundImage=`url("${u}")`);
const pv=document.createElement('div');pv.className='pv';c.insertBefore(pv,c.firstChild);let t;
c.onclick=()=>open(+c.dataset.i,false);
c.addEventListener('mouseenter',()=>{if(reduce||!wide)return;t=setTimeout(()=>{pv.innerHTML=`<iframe src="${bgm(f)}" allow="autoplay" title=""></iframe>`;$('iframe',pv).onload=()=>setTimeout(()=>pv.classList.add('on'),400)},300)});
c.addEventListener('mouseleave',()=>{clearTimeout(t);pv.classList.remove('on');pv.innerHTML=''})});
const upd=()=>{$('#nxt').hidden=row.scrollLeft+row.clientWidth>=row.scrollWidth-6;$('#prv').hidden=row.scrollLeft<6};
row.addEventListener('scroll',upd);addEventListener('resize',upd);setTimeout(upd,300);
$('#nxt').onclick=()=>row.scrollBy({left:row.clientWidth*.8,behavior:'smooth'});$('#prv').onclick=()=>row.scrollBy({left:-row.clientWidth*.8,behavior:'smooth'});
// player (Play all advances automatically)
const md=$('#md'),mb=$('#mb'),nx=$('#nx');
function open(i,all,tv){const f=F[i],n=live[live.indexOf(i)+1];
mb.style.paddingTop=f.r+'%';mb.style.width=`min(1100px,100%,calc((100vh - 170px)*${100/f.r}))`;
mb.innerHTML=`<iframe id="pf" src="https://player.vimeo.com/video/${f.id}?${hp(f)}badge=0&autoplay=1&player_id=0&app_id=58479" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" title="${f.title}"></iframe>`;
nx.hidden=n===undefined;if(n!==undefined){nx.textContent='Up next: '+F[n].title;nx.onclick=()=>open(n,all)}
if(all&&window.Vimeo)new Vimeo.Player($('#pf')).on('ended',()=>{n!==undefined?open(n,true):close()});
md.hidden=false;document.body.style.overflow='hidden';
if(tv&&md.requestFullscreen)md.requestFullscreen().catch(()=>{})}
function close(){md.hidden=true;mb.innerHTML='';document.body.style.overflow='';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
$('#mx').onclick=close;md.onclick=e=>{if(e.target===md)close()};
$('#all').onclick=()=>open(live[0],true);
// downloads
const REVIEWS=[{n:'The Knot',u:'https://theknot.com/review-wedding-vendors/2095933'},{n:'WeddingWire',u:'https://www.weddingwire.com/shared/rate/new?vid=5994eb3553677fe4'},{n:'Google',u:'https://g.page/r/CYtKKGGLKByWEAE/review'}];
$('#rl').innerHTML=REVIEWS.map(r=>`<a class="pill" href="${r.u}" target="_blank" rel="noopener">${r.n}</a>`).join('');
const rm=$('#rm');$('#rv').onclick=()=>rm.hidden=false;$('#rx').onclick=()=>rm.hidden=true;rm.onclick=e=>{if(e.target===rm)rm.hidden=true};
if(COUPLE.download)$('#dlb').href=COUPLE.download;else $('#dlb').hidden=true;
addEventListener('keydown',e=>{if(e.key==='Escape'){close();rm.hidden=true}});
// share
async function share(btn){const d={title:COUPLE.names+' — A Promise Pine Film',url:location.href};
if(navigator.share){try{await navigator.share(d)}catch(_){}return}
try{await navigator.clipboard.writeText(d.url);const s=btn.querySelector('.lbl')||btn,o=s.textContent;s.textContent='Link copied';setTimeout(()=>s.textContent=o,2000)}catch(_){prompt('Copy this link',d.url)}}
$('#shb').onclick=e=>share(e.currentTarget);
</script>
</body>
</html>
